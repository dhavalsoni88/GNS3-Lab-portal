# Nginx reverse proxy for the GNS3 Lab Portal.
# Copy to /etc/nginx/sites-available/, set server_name and certificate
# paths, link it into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Then set PORTAL_COOKIE_SECURE=true and PORTAL_PUBLIC_URL in the portal's .env.

# Limit sign-in attempts per client: every attempt runs a memory-hard password hash.
map $request_uri $gns3_portal_signin {
    ~^/(login|auth/)  $binary_remote_addr;
    default           "";
}
limit_req_zone $gns3_portal_signin zone=gns3_portal_signin:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name lab-portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    # "ssl http2" works on every Nginx in Ubuntu 22.04/24.04 (1.18/1.24); 1.25+ also accepts "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lab-portal.example.com;

    ssl_certificate     /etc/ssl/certs/lab-portal.example.com.pem;
    ssl_certificate_key /etc/ssl/private/lab-portal.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Backup and appliance-disk uploads can be tens of gigabytes. The portal enforces its own limits
    # (PORTAL_MAX_UPLOAD_BYTES and PORTAL_MAX_APPLIANCE_IMAGE_BYTES), so Nginx does not.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        limit_req zone=gns3_portal_signin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        # $http_host keeps a non-standard port (https://lab.example.com:8443); the portal compares it
        # with the browser's Origin header, so with $host every form would be refused as cross-site.
        proxy_set_header Host $http_host;
        # The portal trusts X-Forwarded-For only from PORTAL_TRUSTED_PROXIES (127.0.0.1 by default).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports and backup downloads stream for a long time.
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
        proxy_buffering off;
    }
}
