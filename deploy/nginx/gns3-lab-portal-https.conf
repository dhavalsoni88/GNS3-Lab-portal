# Nginx for the GNS3 Lab Portal with a certificate managed from the portal.
# Installed by scripts/setup-https.sh (placeholders @...@ are filled in there).
# The certificate in @TLS_DIR@/active is replaced from Administration > HTTPS in the portal;
# gns3-lab-portal-tls.path then reloads Nginx, so you do not edit this file to change certificates.

# Limit sign-in attempts per client: every attempt runs a memory-hard password hash.
map $request_uri $gns3_portal_signin {
    ~^/(login|auth/)  $binary_remote_addr;
    default           "";
}
limit_req_zone $gns3_portal_signin zone=gns3_portal_signin:10m rate=30r/m;

server {
    listen 80;
    #ipv6# listen [::]:80;
    server_name @FQDN@ _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    #ipv6# listen [::]:443 ssl;
    server_name @FQDN@ _;

    ssl_certificate     @TLS_DIR@/active/fullchain.pem;
    ssl_certificate_key @TLS_DIR@/active/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:gns3_portal_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Backup and appliance-disk uploads can be tens of gigabytes. The portal enforces its own limits.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        limit_req zone=gns3_portal_signin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        # $http_host keeps a non-standard port; the portal compares it with the browser's Origin header.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports and backup downloads stream for a long time.
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
        proxy_buffering off;
    }
}
