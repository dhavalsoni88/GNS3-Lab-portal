# Nginx reverse proxy for the GNS3 Lab Portal.
# Copy to /etc/nginx/sites-available/, set server_name and certificate
# paths, link it into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Then set PORTAL_COOKIE_SECURE=true and PORTAL_PUBLIC_URL in the portal's .env.

server {
    listen 80;
    listen [::]:80;
    server_name lab-portal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lab-portal.example.com;

    ssl_certificate     /etc/ssl/certs/lab-portal.example.com.pem;
    ssl_certificate_key /etc/ssl/private/lab-portal.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Backup uploads can be several gigabytes. Keep in step with PORTAL_MAX_UPLOAD_BYTES.
    client_max_body_size 50g;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The portal trusts X-Forwarded-For only from PORTAL_TRUSTED_PROXIES (127.0.0.1 by default).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Exports and backup downloads stream for a long time.
        proxy_read_timeout 4h;
        proxy_send_timeout 4h;
        proxy_buffering off;
    }
}
