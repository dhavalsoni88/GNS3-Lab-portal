name: Bug report
description: Something in the portal does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not report security vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to …\n2. Select …\n3. See error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Portal version or commit
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, MariaDB]
  - type: input
    id: gns3
    attributes:
      label: GNS3 server version
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From portal.log, gns3-api.log or journalctl. Remove host names, addresses and usernames first.
      render: text
