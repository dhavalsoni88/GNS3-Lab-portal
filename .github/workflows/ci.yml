name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (MariaDB)
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system libraries for xmlsec
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxmlsec1-dev
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py portal_db.py portal_auth.py scripts tests
      - name: Check shell scripts
        run: bash -n scripts/setup-mariadb.sh && bash -n scripts/migrate-snapshots-to-hdd-store.sh
      - name: Run tests
        env:
          PORTAL_DB_HOST: 127.0.0.1
          PORTAL_DB_USER: root
          PORTAL_DB_PASSWORD: ci-root-password
        run: python -m pytest -q
