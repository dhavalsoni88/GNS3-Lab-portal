<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}My Lab{% endblock %}</title><link rel="stylesheet" href="/static/app.css"></head><body>{% if not login_page %}<header><a class="brand" href="/">My Lab</a>{% if auth_enabled and user %}<div class="account"><a class="link" href="/profile">My Profile</a>{% if can_manage_users %}<a class="link" href="/admin/users">Manage Users</a>{% endif %}<form action="/logout" method="post"><button class="link">Sign out</button></form></div>{% endif %}</header>{% endif %}<main>{% if impersonating %}<section class="impersonation-banner">You are managing labs as <strong>{{ impersonating }}</strong>.<form action="/admin/stop-impersonation" method="post"><button class="secondary">Return to admin</button></form></section>{% endif %}{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
